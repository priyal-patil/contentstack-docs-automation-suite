# =============================================================================
# CMS Content Modeling — 44 flows in CRUD sequence, 1 worker, 5 min cap
#
# Flows (CRUD order):
#   Create : create-content-type, quickstart-in-5-mins, import-content-type
#   Read   : about-field-properties, add-a-field-visibility-rule (×3),
#            boolean (×2), example-from-bulk, example-from-csv,
#            content-type-versioning, copy-content-type, custom, date-part-1,
#            default-value, display-name, export-content-type, global-part-1,
#            group (×2), html-based-rich-text-editor (×3), instruction-value,
#            managing-non-localizable-fields, mandatory,
#            minimum-and-maximum-limit (×2), modular-blocks (×2),
#            multiple-part-1, select-extension-app-for-custom-field-only,
#            show-as-tab, switch-between-alphabetical-and-label-view,
#            unique-id, unique-part-1, use-default-url-pattern,
#            validation-error-message, validation-regex-part-1
#   Update : create-and-apply-labels, manage-labels, edit-content-type
#   Delete : delete-content-type
#
# Trigger: workflow_dispatch only (manual run from Actions tab)
# =============================================================================

name: CMS Content Modeling — CRUD flows (manual)

on:
  workflow_dispatch:
    inputs:
      skip_slack:
        description: "Skip Slack notification"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_report_email:
        description: "Skip report email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  cms-content-modeling:
    name: CMS Content Modeling — 44 CRUD flows (1 worker, 5 min/flow)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user root
    timeout-minutes: 480
    env:
      CI: "true"
      PLAYWRIGHT_HEADLESS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPEN_FLOW_REPORT: "false"
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      PW_WORKERS: "1"
      PW_SLOWMO: "0"
      PW_FLOW_MAX_MINUTES: "5"
      REPORT_DIR: ${{ github.workspace }}/reports/cms-content-modeling-${{ github.run_id }}-${{ github.run_attempt }}
      SKIP_SLACK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Write .env for automation
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written"

      - name: Record batch start time
        id: batch_start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"
          echo "CMS Content Modeling started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee "${{ env.REPORT_DIR }}/content-modeling-run.log"

      - name: Run CMS Content Modeling — 11 CRUD flows (exact sequence via script)
        id: content_modeling_run
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Starting CMS Content Modeling via scripts/run-cms-content-modeling.sh…"
          echo "Sequence: import-prebuilt-content-models → hero-banner → about-us-page → … → website-homepage"
          bash scripts/run-cms-content-modeling.sh
          EXIT_CODE=$?
          echo "Content Modeling exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      - name: Compute run time and generate reports
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
          BATCH_START_ISO: ${{ steps.batch_start.outputs.start_iso }}
          CONTENT_MODELING_OUTCOME: ${{ steps.content_modeling_run.outcome }}
        run: |
          set -eo pipefail
          END_EPOCH="$(date +%s)"
          ELAPSED_SECS=$(( END_EPOCH - BATCH_START_EPOCH ))
          ELAPSED_MIN=$(( ELAPSED_SECS / 60 ))
          ELAPSED_SEC=$(( ELAPSED_SECS % 60 ))

          echo "" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "CMS Content Modeling finished" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "  Started  : ${BATCH_START_ISO}" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "  Finished : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "  Duration : ${ELAPSED_MIN}m ${ELAPSED_SEC}s" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "  Outcome  : ${CONTENT_MODELING_OUTCOME}" | tee -a "$REPORT_DIR/content-modeling-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/content-modeling-run.log"

          cat > "$REPORT_DIR/timing-summary.txt" <<EOF
          CMS Content Modeling — Duration: ${ELAPSED_MIN}m ${ELAPSED_SEC}s
          Started:  ${BATCH_START_ISO}
          Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Outcome:  ${CONTENT_MODELING_OUTCOME}
          Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            npx ts-node scripts/generateCmsExcelReport.ts    --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateCmsDashboardHtml.ts  --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateUnifiedReport.ts     --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/urlRunSummaryAndSlack.ts      --reportDir "$REPORT_DIR" 2>&1 || true
          else
            echo "::warning::flows-results.json not found — report generation skipped."
          fi

      - name: Upload CMS Content Modeling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-content-modeling-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-content-modeling-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-content-modeling-playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-content-modeling-${{ github.run_id }}-${{ github.run_attempt }}/html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-content-modeling-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Report email — gate on secrets
        id: email_gate
        if: always()
        env:
          TO: ${{ secrets.REPORT_EMAIL_TO }}
          HOST: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          USER: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          PASS: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          PORT_RAW: ${{ secrets.REPORT_EMAIL_SMTP_PORT }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_REPORT_EMAIL:-}" == "1" ]] || \
             [[ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_report_email == 'true' }}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PORT="${PORT_RAW:-587}"
          if [[ -z "${TO:-}" || -z "${HOST:-}" || -z "${USER:-}" || -z "${PASS:-}" || -z "${FROM:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped — REPORT_EMAIL_* secrets not fully configured."
            exit 0
          fi
          echo "enabled=true"  >> "$GITHUB_OUTPUT"
          echo "server_port=${PORT}" >> "$GITHUB_OUTPUT"
          [[ "${PORT}" == "465" ]] && echo "secure=true" >> "$GITHUB_OUTPUT" || echo "secure=false" >> "$GITHUB_OUTPUT"

      - name: Report email — write body
        id: email_body
        if: always() && steps.email_gate.outputs.enabled == 'true'
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          CMS_STEP_OUTCOME: ${{ steps.content_modeling_run.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx ts-node scripts/gha/writeCmsDailyReportEmailBody.ts "${{ github.workspace }}/cms-content-modeling-email-body.txt" || true

      - name: Report email — send
        if: always() && steps.email_gate.outputs.enabled == 'true' && steps.email_body.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          server_port: ${{ steps.email_gate.outputs.server_port }}
          username: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          secure: ${{ steps.email_gate.outputs.secure == 'true' }}
          subject: >-
            [CMS Content Modeling] ${{ steps.content_modeling_run.outcome }} — ${{ github.repository }} (#${{ github.run_number }})
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          body: file://${{ github.workspace }}/cms-content-modeling-email-body.txt

      - name: Post Slack summary
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CMS_STEP_OUTCOME: ${{ steps.content_modeling_run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_SLACK: ${{ inputs.skip_slack == 'true' && '1' || '0' }}
        run: |
          set -eo pipefail
          if [[ "${SKIP_SLACK:-0}" == "1" ]]; then
            echo "Slack skipped per input."
            exit 0
          fi
          if [[ -z "${SLACK_BOT_TOKEN:-}" || -z "${SLACK_CHANNEL_ID:-}" ]]; then
            echo "::warning::Slack skipped — SLACK_BOT_TOKEN and/or SLACK_CHANNEL_ID not configured."
            exit 0
          fi

          START="${{ steps.batch_start.outputs.start_epoch }}"
          END="$(date +%s)"
          ELAPSED=$(( END - START ))
          ELAPSED_MIN=$(( ELAPSED / 60 ))
          ELAPSED_SEC=$(( ELAPSED % 60 ))
          DURATION="${ELAPSED_MIN}m ${ELAPSED_SEC}s"

          if [[ -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "Posting detailed Slack summary via urlRunSummaryAndSlack.ts…"
            BATCH1_DURATION_LABEL="CMS Content Models (${DURATION})" \
            CMS_SLACK_TITLE="CMS Content Models — URL run summary" \
              npx ts-node scripts/urlRunSummaryAndSlack.ts 2>&1 || \
              echo "::warning::urlRunSummaryAndSlack.ts failed — posting minimal alert"
          else
            ICON=":white_check_mark:"
            [[ "${CMS_STEP_OUTCOME:-}" != "success" ]] && ICON=":x:"
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json" \
              --data "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${ICON} *CMS Content Models — ${CMS_STEP_OUTCOME:-unknown}* | Duration: ${DURATION} | 44 CRUD flows | 1 worker | 5 min cap. <${RUN_URL}|Open run>\"}" \
              | grep -q '"ok":true' && echo "Slack posted." || echo "::warning::Slack API call failed."
          fi
