# =============================================================================
# CMS JSON Rich Text Editor Module — manual test run (11 flows, CRUD sequence)
#
# CRUD order (1 worker, sequential):
#   Read   : basic-formatting, assets,
#            block-and-inline-properties-part-1,
#            block-and-inline-properties-part-2,
#            code-blocks,
#            embed-entries-or-assets-part-1,
#            embed-entries-or-assets-part-2,
#            markdown-content,
#            use-slash-command-for-shortcuts-in-json-rte,
#            videos-and-social-embeds
#   Update : customize-json-rich-text-editor
#
# Trigger: manual only (Actions tab → "Run workflow")
# Stack  : DEFAULT_STACK secret (same as nightly batches)
# =============================================================================

name: CMS JSON Rich Text Editor Module — manual test (11 flows, CRUD)

on:
  workflow_dispatch:
    inputs:
      skip_slack:
        description: "Skip Slack notification"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  cms-json-rte-module:
    name: CMS JSON Rich Text Editor Module — 11 flows (1 worker, CRUD)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user root
    timeout-minutes: 120
    env:
      CI: "true"
      PLAYWRIGHT_HEADLESS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPEN_FLOW_REPORT: "false"
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      PW_SLOWMO: "0"
      # 1 worker so flows run sequentially in CRUD order
      PW_WORKERS: "1"
      PW_FLOW_MAX_MINUTES: "5"
      PW_ACTION_TIMEOUT_MINUTES: "3"
      CMS_SEQUENTIAL_MODULE_ORDER: "0"
      CMS_CONTINUE_ON_FAIL: "0"
      REPORT_DIR: ${{ github.workspace }}/reports/cms-json-rte-${{ github.run_id }}-${{ github.run_attempt }}
      SKIP_SLACK: "1"

    steps:
      # -------------------------------------------------------------------
      # 1) Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2) npm cache + install
      # -------------------------------------------------------------------
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # 3) Credentials from secrets
      # -------------------------------------------------------------------
      - name: Write .env for automation
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env

      # -------------------------------------------------------------------
      # 4) Record start time
      # -------------------------------------------------------------------
      - name: Record start time
        id: run_start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"

      # -------------------------------------------------------------------
      # 5) Seed — create a CT with JSON RTE field (prerequisite for main flows)
      # -------------------------------------------------------------------
      - name: Seed — create CT with JSON RTE field
        id: seed_json_rte
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Running seed flow: seed-ct-json-rte"
          set +e
          npx playwright test tests/flows.spec.ts --project=flows \
            --grep "Project=CMS Module=json-rich-text-editor Stage=seed" \
            2>&1 | tee "${{ env.REPORT_DIR }}/seed-json-rte-run.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Seed exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      # -------------------------------------------------------------------
      # 6) Run JSON RTE read flows (10 flows) — use seed CT, no CT creation
      #    basic-formatting, assets,
      #    block-and-inline-properties-part-1, block-and-inline-properties-part-2,
      #    code-blocks, embed-entries-or-assets-part-1, embed-entries-or-assets-part-2,
      #    markdown-content, use-slash-command-for-shortcuts-in-json-rte, videos-and-social-embeds
      # -------------------------------------------------------------------
      - name: Run JSON RTE read flows (10 flows)
        id: json_rte_read
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Running JSON RTE read flows: basic-formatting → assets → block-and-inline-properties-part-1 → block-and-inline-properties-part-2 → code-blocks → embed-entries-or-assets-part-1 → embed-entries-or-assets-part-2 → markdown-content → use-slash-command-for-shortcuts-in-json-rte → videos-and-social-embeds"
          set +e
          npx playwright test tests/flows.spec.ts --project=flows \
            --grep "Project=CMS Module=json-rich-text-editor Stage=main" \
            --grep-invert "customize-json-rich-text-editor" \
            2>&1 | tee "${{ env.REPORT_DIR }}/json-rte-read-run.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Read flows exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      # -------------------------------------------------------------------
      # 7) Run customize-json-rich-text-editor (update flow) — runs AFTER
      #    read flows so its intermediate CT creation does not pollute CT selection
      # -------------------------------------------------------------------
      - name: Run customize-json-rich-text-editor (update flow)
        id: json_rte_customize
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Running update flow: customize-json-rich-text-editor"
          set +e
          npx playwright test tests/flows.spec.ts --project=flows \
            --grep "customize-json-rich-text-editor" \
            2>&1 | tee "${{ env.REPORT_DIR }}/json-rte-customize-run.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Customize exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      # -------------------------------------------------------------------
      # 8) Generate reports (always)
      # -------------------------------------------------------------------
      - name: Generate reports
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          BATCH_START_EPOCH: ${{ steps.run_start.outputs.start_epoch }}
          JSON_RTE_READ_OUTCOME: ${{ steps.json_rte_read.outcome }}
          JSON_RTE_CUSTOMIZE_OUTCOME: ${{ steps.json_rte_customize.outcome }}
        run: |
          set -eo pipefail
          END_EPOCH="$(date +%s)"
          ELAPSED_SECS=$(( END_EPOCH - BATCH_START_EPOCH ))
          ELAPSED_MIN=$(( ELAPSED_SECS / 60 ))
          ELAPSED_SEC=$(( ELAPSED_SECS % 60 ))
          LOG="$REPORT_DIR/json-rte-read-run.log"
          JSON_RTE_OUTCOME="${JSON_RTE_READ_OUTCOME:-unknown}"
          [[ "${JSON_RTE_CUSTOMIZE_OUTCOME:-}" == "failure" ]] && JSON_RTE_OUTCOME="failure"

          echo "" | tee -a "$LOG"
          echo "=============================" | tee -a "$LOG"
          echo "JSON RTE module — ${JSON_RTE_OUTCOME}" | tee -a "$LOG"
          echo "  Started  : ${{ steps.run_start.outputs.start_iso }}" | tee -a "$LOG"
          echo "  Finished : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$LOG"
          echo "  Duration : ${ELAPSED_MIN}m ${ELAPSED_SEC}s" | tee -a "$LOG"
          echo "=============================" | tee -a "$LOG"

          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            npx ts-node scripts/generateCmsExcelReport.ts   --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/generateCmsDashboardHtml.ts --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/generateUnifiedReport.ts    --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/generateAllFlowReportsHtml.ts --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/urlRunSummaryAndSlack.ts    --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
          fi

      # -------------------------------------------------------------------
      # 9) Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-json-rte-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-json-rte-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-json-rte-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore

      # -------------------------------------------------------------------
      # 8) Slack summary (optional)
      # -------------------------------------------------------------------
      - name: Post Slack summary
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JSON_RTE_READ_OUTCOME: ${{ steps.json_rte_read.outcome }}
          JSON_RTE_CUSTOMIZE_OUTCOME: ${{ steps.json_rte_customize.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_SLACK: ${{ inputs.skip_slack == 'true' && '1' || '0' }}
        run: |
          set -eo pipefail
          if [[ "${SKIP_SLACK:-0}" == "1" ]]; then
            echo "Slack skipped per input."
            exit 0
          fi
          if [[ -z "${SLACK_BOT_TOKEN:-}" || -z "${SLACK_CHANNEL_ID:-}" ]]; then
            echo "::warning::Slack skipped — SLACK_BOT_TOKEN and/or SLACK_CHANNEL_ID not configured."
            exit 0
          fi

          START="${{ steps.run_start.outputs.start_epoch }}"
          END="$(date +%s)"
          DURATION="$(( (END - START) / 60 ))m $(( (END - START) % 60 ))s"

          if [[ -f "${REPORT_DIR}/flows-results.json" ]]; then
            CMS_BATCH_DURATION_LABEL="CMS JSON Rich Text Editor Module (${DURATION})" \
              npx ts-node scripts/urlRunSummaryAndSlack.ts --reportDir "${REPORT_DIR}" 2>&1 || \
              echo "::warning::urlRunSummaryAndSlack.ts failed"
          else
            OVERALL="success"
            [[ "${JSON_RTE_READ_OUTCOME:-}" != "success" ]] && OVERALL="${JSON_RTE_READ_OUTCOME:-unknown}"
            [[ "${JSON_RTE_CUSTOMIZE_OUTCOME:-}" == "failure" ]] && OVERALL="failure"
            ICON=":white_check_mark:"
            [[ "${OVERALL}" != "success" ]] && ICON=":x:"
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json" \
              --data "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${ICON} *CMS JSON Rich Text Editor Module — ${OVERALL}* | Duration: ${DURATION} | 11 flows (CRUD) | <${RUN_URL}|Open run>\"}" \
              | grep -q '"ok":true' && echo "Slack posted." || echo "::warning::Slack API call failed."
          fi

      - name: Publish report to dashboard (CMS JSON Rich Text Editor Module)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
          REPORT_DIR: ${{ env.REPORT_DIR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BATCH_START_EPOCH: ${{ steps.run_start.outputs.start_epoch }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::Publish to dashboard skipped — DASHBOARD_DATA_TOKEN secret not configured."
            exit 0
          fi
          if [[ ! -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "::warning::Publish to dashboard skipped — flows-results.json not found."
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - BATCH_START_EPOCH ))
          DURATION_SECONDS="${ELAPSED}" npx ts-node scripts/publishToDashboard.ts \
            --reportDir "${REPORT_DIR}" \
            --suite cms-json-rte \
            --suiteLabel "CMS JSON Rich Text Editor Module" \
            --out /tmp/dashboard-cms-json-rte.json \
            --reportsOutDir /tmp/reports-cms-json-rte \
            2>&1 || { echo "::warning::publishToDashboard.ts failed"; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git" /tmp/dashboard-data
          cd /tmp/dashboard-data
          if [ -d /tmp/reports-cms-json-rte ]; then
            node scripts/publish.js /tmp/dashboard-cms-json-rte.json:/tmp/reports-cms-json-rte
          else
            node scripts/publish.js /tmp/dashboard-cms-json-rte.json
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish contentstack-docs-automation-suite/cms-json-rte report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
