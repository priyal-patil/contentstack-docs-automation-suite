# Nightly (or manual) Documentation Automation: Playwright + unified reports + Slack.
#
# GitHub-hosted job hard cap is ~6h; timeout-minutes is set to 360 below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CS_EMAIL          — Contentstack account email (global-setup login)
#   CS_PASSWORD       — Contentstack account password
#   DEFAULT_STACK     — Stack UID for `selectStack` flows (same as CMS daily workflow); without it,
#                       `core/navigation.ts` throws and CMS (and any stack-scoped) Playwright flows fail.
#
# Optional:
#   SLACK_WEBHOOK_URL — Incoming webhook URL for a short summary (pass / warn / fail counts)
#
# Artifacts: unified-dashboard.html, master-report.xlsx, unified-report.json, full report folder.
#
# To run only from the Actions tab without waiting for cron: "Run workflow".

name: Nightly documentation automation

on:
  workflow_dispatch:
  schedule:
    # 07:00 IST = 01:30 UTC daily — GHA uses UTC; adjust or comment out for manual-only
    - cron: "30 1 * * *"

concurrency:
  group: docs-automation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # upload-artifact (some org defaults require explicit grant)

env:
  PLAYWRIGHT_HEADLESS: "1"
  CI: "true"
  # Isolate this run’s reports (Playwright JSON + unified output)
  REPORT_DIR: ${{ github.workspace }}/reports/run-${{ github.run_id }}
  # Slack message header: "Nightly Docs-QA Audit: <label>" (override per repo / matrix)
  SLACK_PROJECT_LABEL: CMS
  SLACK_TIMEZONE: UTC

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # global-setup + core/env.ts use loadRuntimeEnv(), which requires a real .env FILE on disk (not
      # just step env). CMS flows also require DEFAULT_STACK for ensureOnStacksAndSelectStack — match
      # .github/workflows/cms-daily-scheduled.yml so nightly runs don't fail immediately in CI.
      - name: Write .env for automation (from secrets)
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required (stack UID for selectStack flows)}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
          } > .env
          chmod 600 .env
          echo "✓ .env written for Playwright global-setup / navigation (values not shown)"

      - name: Run Playwright (docs HTTP + docs-audit + flows)
        id: playwright
        continue-on-error: true
        env:
          DOCS_URLS_CSV: ${{ github.workspace }}/data/docs-urls.csv
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          npx playwright test \
            tests/docs.spec.ts \
            tests/docs-audit.spec.ts \
            tests/flows.spec.ts \
            --project=default \
            --project=docs-audit \
            --project=flows

      - name: Generate unified report
        if: always()
        run: npx ts-node scripts/generateUnifiedReport.ts --reportDir "$REPORT_DIR"

      - name: Merge combined CSV (optional)
        if: always()
        run: npx ts-node core/report/mergeResults.ts --reportDir "$REPORT_DIR" || true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-reports-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}/unified-dashboard.html
            ${{ env.REPORT_DIR }}/master-report.xlsx
            ${{ env.REPORT_DIR }}/master-report.csv
            ${{ env.REPORT_DIR }}/unified-report.json
            ${{ env.REPORT_DIR }}/flows-results.json
            ${{ env.REPORT_DIR }}/docs-audit-summary.json
            ${{ env.REPORT_DIR }}/html
          if-no-files-found: warn

      - name: Slack summary (optional)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SLACK_PROJECT_LABEL: ${{ env.SLACK_PROJECT_LABEL }}
          SLACK_TIMEZONE: ${{ env.SLACK_TIMEZONE }}
        run: node scripts/ci/slackUnifiedNotify.cjs

      - name: Fail job if Playwright tests failed
        if: steps.playwright.outcome != 'success'
        run: |
          echo "::error::Playwright tests did not succeed (see artifacts and logs)."
          exit 1
