# =============================================================================
# CMS Search — 13 flows in CRUD sequence, 1 worker, 5 min cap
#
# Flows (CRUD order):
#   basic-search, quick-search, partial-search, advanced-search,
#   use-filters, get-localized-entries, about-localization-operator,
#   save-your-views, shared-views, use-saved-views,
#   publish-entries-and-assets-in-bulk, unpublish-entries-and-assets-in-bulk,
#   delete-entries-and-assets-in-bulk
#
# Trigger: workflow_dispatch only (manual run from Actions tab)
# =============================================================================

name: CMS Search — CRUD flows (manual)

on:
  workflow_dispatch:
    inputs:
      skip_slack:
        description: "Skip Slack notification"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_report_email:
        description: "Skip report email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  cms-search:
    name: CMS Search — 13 CRUD flows (1 worker, 5 min/flow)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user root
    timeout-minutes: 180
    env:
      CI: "true"
      PLAYWRIGHT_HEADLESS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPEN_FLOW_REPORT: "false"
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      PW_WORKERS: "1"
      PW_SLOWMO: "0"
      PW_FLOW_MAX_MINUTES: "5"
      REPORT_DIR: ${{ github.workspace }}/reports/cms-search-${{ github.run_id }}-${{ github.run_attempt }}
      SKIP_SLACK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Write .env for automation
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written"

      - name: Record batch start time
        id: batch_start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"
          echo "CMS Search started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee "${{ env.REPORT_DIR }}/search-run.log"

      - name: Run CMS Search — 13 CRUD flows (exact sequence via script)
        id: search_run
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Starting CMS Search via scripts/run-cms-search.sh…"
          echo "Sequence: basic-search → … → delete-entries-and-assets-in-bulk"
          bash scripts/run-cms-search.sh
          EXIT_CODE=$?
          echo "Search exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      - name: Compute run time and generate reports
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
          BATCH_START_ISO: ${{ steps.batch_start.outputs.start_iso }}
          SEARCH_OUTCOME: ${{ steps.search_run.outcome }}
        run: |
          set -eo pipefail
          END_EPOCH="$(date +%s)"
          ELAPSED_SECS=$(( END_EPOCH - BATCH_START_EPOCH ))
          ELAPSED_MIN=$(( ELAPSED_SECS / 60 ))
          ELAPSED_SEC=$(( ELAPSED_SECS % 60 ))

          echo "" | tee -a "$REPORT_DIR/search-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/search-run.log"
          echo "CMS Search finished" | tee -a "$REPORT_DIR/search-run.log"
          echo "  Started  : ${BATCH_START_ISO}" | tee -a "$REPORT_DIR/search-run.log"
          echo "  Finished : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$REPORT_DIR/search-run.log"
          echo "  Duration : ${ELAPSED_MIN}m ${ELAPSED_SEC}s" | tee -a "$REPORT_DIR/search-run.log"
          echo "  Outcome  : ${SEARCH_OUTCOME}" | tee -a "$REPORT_DIR/search-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/search-run.log"

          cat > "$REPORT_DIR/timing-summary.txt" <<EOF
          CMS Search — Duration: ${ELAPSED_MIN}m ${ELAPSED_SEC}s
          Started:  ${BATCH_START_ISO}
          Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Outcome:  ${SEARCH_OUTCOME}
          Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            npx ts-node scripts/generateCmsExcelReport.ts    --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateCmsDashboardHtml.ts  --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateUnifiedReport.ts     --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateAllFlowReportsHtml.ts --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/urlRunSummaryAndSlack.ts      --reportDir "$REPORT_DIR" 2>&1 || true
          else
            echo "::warning::flows-results.json not found — report generation skipped."
          fi

      - name: Upload CMS Search reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-search-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-search-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-search-playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-search-${{ github.run_id }}-${{ github.run_attempt }}/html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cms-search-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Report email — gate on secrets
        id: email_gate
        if: always()
        env:
          TO: ${{ secrets.REPORT_EMAIL_TO }}
          HOST: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          USER: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          PASS: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          PORT_RAW: ${{ secrets.REPORT_EMAIL_SMTP_PORT }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_REPORT_EMAIL:-}" == "1" ]] || \
             [[ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_report_email == 'true' }}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PORT="${PORT_RAW:-587}"
          if [[ -z "${TO:-}" || -z "${HOST:-}" || -z "${USER:-}" || -z "${PASS:-}" || -z "${FROM:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped — REPORT_EMAIL_* secrets not fully configured."
            exit 0
          fi
          echo "enabled=true"  >> "$GITHUB_OUTPUT"
          echo "server_port=${PORT}" >> "$GITHUB_OUTPUT"
          [[ "${PORT}" == "465" ]] && echo "secure=true" >> "$GITHUB_OUTPUT" || echo "secure=false" >> "$GITHUB_OUTPUT"

      - name: Report email — write body
        id: email_body
        if: always() && steps.email_gate.outputs.enabled == 'true'
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          CMS_STEP_OUTCOME: ${{ steps.search_run.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx ts-node scripts/gha/writeCmsDailyReportEmailBody.ts "${{ github.workspace }}/cms-search-email-body.txt" || true

      - name: Report email — send
        if: always() && steps.email_gate.outputs.enabled == 'true' && steps.email_body.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          server_port: ${{ steps.email_gate.outputs.server_port }}
          username: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          secure: ${{ steps.email_gate.outputs.secure == 'true' }}
          subject: >-
            [CMS Search] ${{ steps.search_run.outcome }} — ${{ github.repository }} (#${{ github.run_number }})
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          body: file://${{ github.workspace }}/cms-search-email-body.txt

      - name: Post Slack summary
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CMS_STEP_OUTCOME: ${{ steps.search_run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_SLACK: "0"
        run: |
          set -eo pipefail
          if [[ -z "${SLACK_BOT_TOKEN:-}" || -z "${SLACK_CHANNEL_ID:-}" ]]; then
            echo "::warning::Slack skipped — SLACK_BOT_TOKEN and/or SLACK_CHANNEL_ID not configured."
            exit 0
          fi

          START="${{ steps.batch_start.outputs.start_epoch }}"
          END="$(date +%s)"
          ELAPSED=$(( END - START ))
          ELAPSED_MIN=$(( ELAPSED / 60 ))
          ELAPSED_SEC=$(( ELAPSED % 60 ))
          DURATION="${ELAPSED_MIN}m ${ELAPSED_SEC}s"

          if [[ -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "Posting detailed Slack summary via urlRunSummaryAndSlack.ts…"
            BATCH1_DURATION_LABEL="CMS Search (${DURATION})" \
              npx ts-node scripts/urlRunSummaryAndSlack.ts 2>&1 || \
              echo "::warning::urlRunSummaryAndSlack.ts failed — posting minimal alert"
          else
            ICON=":white_check_mark:"
            [[ "${CMS_STEP_OUTCOME:-}" != "success" ]] && ICON=":x:"
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json" \
              --data "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${ICON} *CMS Search — ${CMS_STEP_OUTCOME:-unknown}* | Duration: ${DURATION} | 13 CRUD flows | 1 worker | 5 min cap. <${RUN_URL}|Open run>\"}" \
              | grep -q '"ok":true' && echo "Slack posted." || echo "::warning::Slack API call failed."
          fi

      - name: Publish report to dashboard (CMS Search)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
          REPORT_DIR: ${{ env.REPORT_DIR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::Publish to dashboard skipped — DASHBOARD_DATA_TOKEN secret not configured."
            exit 0
          fi
          if [[ ! -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "::warning::Publish to dashboard skipped — flows-results.json not found."
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - BATCH_START_EPOCH ))
          DURATION_SECONDS="${ELAPSED}" npx ts-node scripts/publishToDashboard.ts \
            --reportDir "${REPORT_DIR}" \
            --suite cms-search \
            --suiteLabel "CMS Search" \
            --out /tmp/dashboard-cms-search.json \
            --reportsOutDir /tmp/reports-cms-search \
            2>&1 || { echo "::warning::publishToDashboard.ts failed"; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git" /tmp/dashboard-data
          cd /tmp/dashboard-data
          if [ -d /tmp/reports-cms-search ]; then
            node scripts/publish.js /tmp/dashboard-cms-search.json:/tmp/reports-cms-search
          else
            node scripts/publish.js /tmp/dashboard-cms-search.json
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish contentstack-docs-automation-suite/cms-search report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
