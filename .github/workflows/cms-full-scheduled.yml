          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"

      - name: Run Batch 3 — 38 delete+trash flows (variable workers per phase)
        id: batch3_run
