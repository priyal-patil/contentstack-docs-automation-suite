# =============================================================================
# CMS documentation URL automation — weekly schedule (cron) + manual dispatch
# =============================================================================
# Policy alignment: sequential CMS modules → retry (optional) → delete batch
# → trash → docs merge/audit/reports — see scripts/run-cms-sequential-modules-dashboard.sh
# and .cursor/rules/cms-execution-order.mdc
#
# Schedule (weekly): Mondays 07:00 IST = 01:30 UTC (India is UTC+5:30, no DST; GHA cron is UTC)
# Cron format: minute hour day-of-month month day-of-week
#
# Runner: **`runs-on: self-hosted`** — executes on YOUR machine or VM so you do not consume GitHub-hosted
# Actions minutes (no hosted-runner billing). You must register a runner (see README → Self-hosted runner).
# GitHub-hosted alternative was `ubuntu-latest` (max job runtime typically 6h; workflow timeout below).
# Scheduled cron sets SKIP_RETRY, SKIP_CMS_DOCS_SPEC, and SKIP_DOCS_AUDIT (no link crawl) to shorten
# wall-clock time; use workflow_dispatch for full docs-audit + optional retry/docs.spec.
# Manual runs: docs-audit can run in the background (default) with a bounded PID wait and artifact
# reports/docs-audit-CMS-* (see docs-audit-background.log under REPORT_DIR).
# =============================================================================

name: CMS — weekly doc automation (scheduled)

on:
  # Manual run from Actions tab (same pipeline as schedule)
  workflow_dispatch:
    inputs:
      skip_retry:
        description: "Manual only: true = skip retry-before-delete. Scheduled cron always sets SKIP_RETRY (6h runner cap)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_slack:
        description: "Set to true to skip urlRunSummaryAndSlack.ts (reports still uploaded as artifacts)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_report_email:
        description: "Set to true to skip SMTP daily report email (even if REPORT_EMAIL_* secrets are set)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      docs_audit_wait_secs:
        description: "Manual only: override docs-audit PID wait after CMS (seconds, 0–7200). Empty = job default DOCS_AUDIT_GHA_WAIT_SECS."
        required: false
        default: ""
        type: string
      skip_docs_audit:
        description: "Manual only: skip all CMS docs crawl (SKIP_DOCS_AUDIT=1, DOCS_AUDIT_BACKGROUND=0) for fastest CI."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Weekly: Monday 07:00 IST → 01:30 UTC (day-of-week: 1 = Monday)
  schedule:
    - cron: "30 1 * * 1"

# Avoid overlapping long CMS runs (do not cancel in-flight; stack new run if needed)
concurrency:
  group: cms-daily-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write # upload-artifact (enterprise/org “restricted” defaults may need this explicit grant)

jobs:
  cms-full-batch:
    name: CMS sequential batch (headless)
    runs-on: self-hosted
    # Hosted runners were capped at 6h; self-hosted jobs can exceed that — adjust if CMS batch needs more wall clock.
    timeout-minutes: 360
    env:
      CI: "true"
      # ----- CI-friendly behaviour (no macOS open(), bounded wall clock for GHA 6h cap) -----
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      # Manual workflow_dispatch: SKIP_DOCS_AUDIT unset → background crawl (bounded PID wait below).
      # Cron sets SKIP_DOCS_AUDIT → no crawl (saves Actions minutes); see sequential batch script.
      DOCS_AUDIT_BACKGROUND: "1"
      PLAYWRIGHT_HEADLESS: "1"
      OPEN_FLOW_REPORT: "false"
      # Deterministic report path for upload (script defaults would still work under reports/)
      REPORT_DIR: ${{ github.workspace }}/reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}
      # Align with scripts/run-cms-sequential-modules-dashboard.sh defaults
      PW_FLOW_MAX_MINUTES: "15"
      PW_WORKERS: "6"
      # Bounded wait after CMS for background docs-audit PID before artifacts upload.
      DOCS_AUDIT_GHA_WAIT_SECS: "1200"
      # If Slack secrets are configured in the repo, the pipeline posts summary (optional)
      # SKIP_SLACK is unset — use SLACK_BOT_TOKEN + SLACK_CHANNEL_ID per scripts/urlRunSummaryAndSlack.ts

    steps:
      # ---------------------------------------------------------------------
      # 1) Checkout
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2) Node + npm cache (lockfile-based)
      # ---------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # ---------------------------------------------------------------------
      # 3) Install JS dependencies (reproducible)
      # ---------------------------------------------------------------------
      - name: Install dependencies (npm ci)
        run: npm ci

      # ---------------------------------------------------------------------
      # 4) Playwright browsers (Chromium is enough for typical headless CMS UI)
      # ---------------------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # 5) Credentials — NEVER echo secrets (GitHub masks secret values in logs)
      # Required repo secrets — see README "GitHub Actions (CMS daily) + Slack reports":
      #   CS_EMAIL, CS_PASSWORD, DEFAULT_STACK
      # Optional:
      #   CS_APP_ORIGIN (default https://app.contentstack.com)
      #   SLACK_BOT_TOKEN + SLACK_CHANNEL_ID (summary post)
      #   REPORT_EMAIL_* — optional SMTP daily summary email (see README)
      #   ENCRYPTION_SECRET_KEY / ENCRYPTION_DATA_XLSX if your Slack path needs them
      # ---------------------------------------------------------------------
      - name: Write .env for automation (from secrets)
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written (credentials not shown)"

      # Retry, docs.spec HTTP sweep, and docs link crawl add wall clock + CPU — skip on cron to save
      # Actions minutes and stay under the 6h cap. Full audit: run workflow_dispatch (default keeps docs-audit).
      - name: Scheduled run — SKIP_RETRY + SKIP_CMS_DOCS_SPEC + SKIP_DOCS_AUDIT
        if: github.event_name == 'schedule'
        run: |
          echo "SKIP_RETRY=1" >> "$GITHUB_ENV"
          echo "SKIP_CMS_DOCS_SPEC=1" >> "$GITHUB_ENV"
          echo "SKIP_DOCS_AUDIT=1" >> "$GITHUB_ENV"
          echo "Scheduled: SKIP_RETRY=1 SKIP_CMS_DOCS_SPEC=1 SKIP_DOCS_AUDIT=1 — shorter run; use manual dispatch for link audit."

      # Optional retry / Slack skips from manual dispatch
      - name: Apply optional SKIP_RETRY (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_retry == 'true'
        run: echo "SKIP_RETRY=1" >> "$GITHUB_ENV"

      - name: Apply optional SKIP_SLACK (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_slack == 'true'
        run: echo "SKIP_SLACK=1" >> "$GITHUB_ENV"

      - name: Apply optional SKIP_REPORT_EMAIL (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_report_email == 'true'
        run: echo "SKIP_REPORT_EMAIL=1" >> "$GITHUB_ENV"

      # Manual tuning: shorten runs or deepen docs-audit wait (workflow_dispatch inputs.*)
      - name: Manual — skip all CMS docs audit (links crawl off)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_docs_audit == 'true'
        run: |
          echo "DOCS_AUDIT_BACKGROUND=0" >> "$GITHUB_ENV"
          echo "SKIP_DOCS_AUDIT=1" >> "$GITHUB_ENV"
          echo "Manual: SKIP_DOCS_AUDIT=1 and DOCS_AUDIT_BACKGROUND=0 — background docs-audit will not start."

      - name: Manual — docs-audit PID wait override (seconds)
        if: github.event_name == 'workflow_dispatch' && inputs.docs_audit_wait_secs != ''
        run: |
          set -euo pipefail
          v="$(echo "${RAW}" | tr -d '[:space:]')"
          if ! [[ "${v}" =~ ^[0-9]+$ ]] || [[ "${v}" -gt 7200 ]]; then
            echo "::error::docs_audit_wait_secs must be an integer 0–7200."
            exit 1
          fi
          echo "DOCS_AUDIT_GHA_WAIT_SECS=${v}" >> "$GITHUB_ENV"
          echo "DOCS_AUDIT_GHA_WAIT_SECS=${v} (manual override)"
        env:
          RAW: ${{ inputs.docs_audit_wait_secs }}

      # ---------------------------------------------------------------------
      # 6) Run full CMS pipeline (module order, CRUD sort, continue-after-URL-failure,
      #    delete batch after main+retry, trash after delete, then merge + reports)
      #    Entry: npm script → scripts/run-cms-headless-report.sh →
      #    scripts/run-cms-sequential-modules-dashboard.sh
      # ---------------------------------------------------------------------
      - name: Run CMS sequential batch (foreground)
        id: cms_run
        run: npm run test:cms:foreground

      # Background docs-audit output lives under reports/docs-audit-CMS-<timestamp>/ (see run-docs-audit-background.sh).

      - name: Wait for CMS docs-audit background process (bounded)
        if: always()
        env:
          REPORT_DIR_ABS: ${{ github.workspace }}/reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eo pipefail
          PIDFILE="${REPORT_DIR_ABS}/docs-audit-background.pid"
          if [[ ! -f "${PIDFILE}" ]]; then
            echo "No ${PIDFILE} (inline audit, or CMS exited before docs-audit fork) — skip wait."
            exit 0
          fi
          pid="$(grep -Eo '[0-9]+' "${PIDFILE}" | head -1 || true)"
          if [[ -z "${pid}" ]]; then
            echo "Could not parse PID — skip wait."
            exit 0
          fi
          max="${DOCS_AUDIT_GHA_WAIT_SECS:-1200}"
          elapsed=0
          if ! kill -0 "${pid}" 2>/dev/null; then
            echo "docs-audit PID ${pid} already exited."
            exit 0
          fi
          echo "Waiting up to ${max}s for docs-audit PID ${pid}…"
          while kill -0 "${pid}" 2>/dev/null; do
            if [[ "${elapsed}" -ge "${max}" ]]; then
              echo "::warning::docs-audit still running after ${max}s — upload may be partial; see docs-audit-CMS-* and docs-audit-background.log."
              exit 0
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "docs-audit PID ${pid} finished (waited ~${elapsed}s)."

      # ---------------------------------------------------------------------
      # 7) Upload artifacts (HTML, Excel, JSON, logs, Playwright report)
      # ---------------------------------------------------------------------
      - name: Upload CMS report directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}/html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload CMS background docs-audit output (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-docs-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/docs-audit-CMS-*
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # 8) Daily report email via SMTP (optional — configure REPORT_EMAIL_* secrets)
      # Sends after uploads so the mail points at the same run/artifacts; runs even if the CMS step failed.
      # ---------------------------------------------------------------------
      - name: Report email — gate on secrets + SKIP_REPORT_EMAIL
        id: report_email_gate
        if: always()
        env:
          TO: ${{ secrets.REPORT_EMAIL_TO }}
          HOST: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          USER: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          PASS: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          PORT_RAW: ${{ secrets.REPORT_EMAIL_SMTP_PORT }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_REPORT_EMAIL:-}" == "1" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped (SKIP_REPORT_EMAIL=1)."
            exit 0
          fi
          PORT="${PORT_RAW:-587}"
          if [[ -z "${TO:-}" || -z "${HOST:-}" || -z "${USER:-}" || -z "${PASS:-}" || -z "${FROM:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped — set REPORT_EMAIL_TO, REPORT_EMAIL_SMTP_HOST, REPORT_EMAIL_SMTP_USERNAME, REPORT_EMAIL_SMTP_PASSWORD, REPORT_EMAIL_FROM (optional REPORT_EMAIL_SMTP_PORT, default 587)."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "server_port=${PORT}" >> "$GITHUB_OUTPUT"
          if [[ "${PORT}" == "465" ]]; then
            echo "secure=true" >> "$GITHUB_OUTPUT"
          else
            echo "secure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report email — write body file
        id: report_email_body
        if: always() && steps.report_email_gate.outputs.enabled == 'true'
        env:
          REPORT_DIR: ${{ github.workspace }}/reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}
          CMS_STEP_OUTCOME: ${{ steps.cms_run.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx ts-node scripts/gha/writeCmsDailyReportEmailBody.ts "${{ github.workspace }}/cms-daily-email-body.txt"

      - name: Report email — send (SMTP)
        if: always() && steps.report_email_gate.outputs.enabled == 'true' && steps.report_email_body.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          server_port: ${{ steps.report_email_gate.outputs.server_port }}
          username: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          secure: ${{ steps.report_email_gate.outputs.secure == 'true' }}
          subject: >-
            [CMS docs automation] ${{ steps.cms_run.outcome }} — ${{ github.repository }} (#${{ github.run_number }})
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          body: file://${{ github.workspace }}/cms-daily-email-body.txt

      # ---------------------------------------------------------------------
      # 9) Lightweight Slack alert on workflow failure (optional Incoming Webhook)
      # Does not replace the product slack summary from urlRunSummaryAndSlack.ts when tokens are set.
      # ---------------------------------------------------------------------
      # Step `if:` must NEVER reference secrets (INVALID: failure() && secrets.SLACK_INCOMING_WEBHOOK_URL).
      # Pass the webhook URL via env and no-op in the shell when unset (matches GitHub’s restriction).
      - name: Slack notify on workflow failure (optional webhook)
        if: failure() || cancelled()
        env:
          HOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
        run: |
          if [[ -z "${HOOK:-}" ]]; then
            echo "Skipping Slack webhook (SLACK_INCOMING_WEBHOOK_URL not configured)."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ *CMS scheduled run failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>\"}" \
            "$HOOK"
