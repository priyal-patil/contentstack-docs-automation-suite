# =============================================================================
# CMS documentation URL automation — daily schedule + manual dispatch
# =============================================================================
# Policy alignment: sequential CMS modules → retry (optional) → delete batch
# → trash → docs merge/audit/reports — see scripts/run-cms-sequential-modules-dashboard.sh
# and .cursor/rules/cms-execution-order.mdc
#
# Schedule: 03:00 IST = 21:30 UTC prior calendar day boundary (India is UTC+5:30, no DST)
# Cron format: minute hour day-of-month month day-of-week
# =============================================================================

name: CMS — daily doc automation (scheduled)

on:
  # Manual run from Actions tab (same pipeline as schedule)
  workflow_dispatch:
    inputs:
      skip_retry:
        description: "Set to true to pass SKIP_RETRY=1 (faster; skips retry-before-delete pass)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Daily 03:00 IST → 21:30 UTC
  schedule:
    - cron: "30 21 * * *"

# Avoid overlapping long CMS runs (do not cancel in-flight; stack new run if needed)
concurrency:
  group: cms-daily-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write # upload-artifact (enterprise/org “restricted” defaults may need this explicit grant)

jobs:
  cms-full-batch:
    name: CMS sequential batch (headless)
    runs-on: ubuntu-latest
    # Full CMS + docs audit + reports can exceed 1–2h; raise if your org batch times out.
    timeout-minutes: 480
    env:
      CI: "true"
      # ----- CI-friendly behaviour (no macOS open(), complete docs-audit in-tree for artifacts) -----
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      # Inline docs-audit so report folder is self-contained when the job ends
      DOCS_AUDIT_BACKGROUND: "0"
      PLAYWRIGHT_HEADLESS: "1"
      OPEN_FLOW_REPORT: "false"
      # Deterministic report path for upload (script defaults would still work under reports/)
      REPORT_DIR: ${{ github.workspace }}/reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}
      # Align with scripts/run-cms-sequential-modules-dashboard.sh defaults
      PW_FLOW_MAX_MINUTES: "15"
      PW_WORKERS: "6"
      # If Slack secrets are configured in the repo, the pipeline posts summary (optional)
      # SKIP_SLACK is unset — use SLACK_BOT_TOKEN + SLACK_CHANNEL_ID per scripts/urlRunSummaryAndSlack.ts

    steps:
      # ---------------------------------------------------------------------
      # 1) Checkout
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2) Node + npm cache (lockfile-based)
      # ---------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # ---------------------------------------------------------------------
      # 3) Install JS dependencies (reproducible)
      # ---------------------------------------------------------------------
      - name: Install dependencies (npm ci)
        run: npm ci

      # ---------------------------------------------------------------------
      # 4) Playwright browsers (Chromium is enough for typical headless CMS UI)
      # ---------------------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # 5) Credentials — NEVER echo secrets (GitHub masks secret values in logs)
      # Required repo secrets (see README / docs in your handoff):
      #   CS_EMAIL, CS_PASSWORD, DEFAULT_STACK
      # Optional:
      #   CS_APP_ORIGIN (default https://app.contentstack.com)
      #   SLACK_BOT_TOKEN + SLACK_CHANNEL_ID (summary post)
      #   ENCRYPTION_SECRET_KEY / ENCRYPTION_DATA_XLSX if your Slack path needs them
      # ---------------------------------------------------------------------
      - name: Write .env for automation (from secrets)
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written (credentials not shown)"

      # Optional retry skip from manual dispatch
      - name: Apply optional SKIP_RETRY (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_retry == 'true'
        run: echo "SKIP_RETRY=1" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 6) Run full CMS pipeline (module order, CRUD sort, continue-after-URL-failure,
      #    delete batch after main+retry, trash after delete, then merge + reports)
      #    Entry: npm script → scripts/run-cms-headless-report.sh →
      #    scripts/run-cms-sequential-modules-dashboard.sh
      # ---------------------------------------------------------------------
      - name: Run CMS sequential batch (foreground)
        id: cms_run
        run: npm run test:cms:foreground

      # ---------------------------------------------------------------------
      # 7) Upload artifacts (HTML, Excel, JSON, logs, Playwright report)
      # ---------------------------------------------------------------------
      - name: Upload CMS report directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/gha-cms-${{ github.run_id }}-${{ github.run_attempt }}/html/**
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # 8) Lightweight Slack alert on workflow failure (optional Incoming Webhook)
      # Does not replace the product slack summary from urlRunSummaryAndSlack.ts when tokens are set.
      # ---------------------------------------------------------------------
      # NOTE: `secrets.*` must not appear in step `if:` — GitHub errors with "Unrecognized named-value: 'secrets'".
      - name: Slack notify on workflow failure (optional webhook)
        if: failure()
        env:
          HOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
        run: |
          if [[ -z "${HOOK:-}" ]]; then
            echo "Skipping Slack webhook (SLACK_INCOMING_WEBHOOK_URL not configured)."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ *CMS daily run failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>\"}" \
            "$HOOK"
