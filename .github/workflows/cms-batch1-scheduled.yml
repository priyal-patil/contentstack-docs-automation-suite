# =============================================================================
# CMS Batch 1 — 5:00 AM IST daily (21 create/setup flows, 1 worker)
# =============================================================================
#
# Runs 21 foundational CMS "create" flows sequentially (PW_WORKERS=1) in a
# fixed order. Each flow is capped at 5 minutes — if it exceeds 5 min it fails
# immediately with a screenshot captured at the point of failure.
#
# Flows (in execution order):
#   add-an-environment, add-a-language, add-a-custom-language, create-a-branch,
#   create-a-new-stack-part-1, create-content-type, create-a-new-release,
#   create-a-global-field, create-a-global-field-part-2, create-upload-assets,
#   create-a-folder, create-an-entry, add-a-comment, create-and-apply-labels,
#   set-up-live-preview-for-your-stack, create-a-taxonomy, create-a-term,
#   create-a-delivery-token, generate-a-management-token,
#   create-a-webhook, add-workflows-and-stages
#
# Schedule: 5:00 AM IST → 23:30 UTC (previous day) — fired by cms-batch1-trigger.yml
# =============================================================================

name: CMS Batch 1 — daily create flows (5 AM IST, 1 worker)

on:
  # Manual trigger only — nightly chain is handled by cms-full-trigger.yml → cms-full-scheduled.yml
  workflow_dispatch:
    inputs:
      skip_slack:
        description: "Skip Slack notification"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_report_email:
        description: "Skip report email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  cms-batch1:
    name: CMS Batch 1 — 21 create flows (1 worker, 5 min/flow)
    runs-on: ubuntu-latest
    # Playwright Docker image: Chromium pre-installed — zero CDN download (25s pull vs 30+ min).
    # v1.58.0 is the first patch in the 1.58.x line; MCR publishes images per minor version.
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user root
    timeout-minutes: 180
    env:
      CI: "true"
      PLAYWRIGHT_HEADLESS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPEN_FLOW_REPORT: "false"
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      # Single browser — all 21 flows run one-by-one in sequence
      PW_WORKERS: "1"
      PW_SLOWMO: "0"
      # Fail a flow immediately if it takes more than 5 minutes
      PW_FLOW_MAX_MINUTES: "5"
      # Screenshot on failure is configured in playwright.config.ts (screenshot: 'only-on-failure')
      # CMS_SEQUENTIAL_MODULE_ORDER and CMS_CONTINUE_ON_FAIL are controlled by
      # scripts/run-cms-batch1.sh (set to 0 so each flow is an individual test
      # that can be targeted by --grep "Project=CMS.*<flow-id>$").
      # Deterministic report path
      REPORT_DIR: ${{ github.workspace }}/reports/cms-batch1-${{ github.run_id }}-${{ github.run_attempt }}
      # Suppress Slack inside bash — GHA step handles Slack so it fires even on crash
      SKIP_SLACK: "1"

    steps:
      # -------------------------------------------------------------------
      # 1) Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2) npm cache + install (Node.js already in Docker image)
      # -------------------------------------------------------------------
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Browsers pre-installed in Docker image. PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      # prevents npm install from trying to download anything.

      # -------------------------------------------------------------------
      # 5) Credentials from secrets
      # -------------------------------------------------------------------
      - name: Write .env for automation
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written"

      # -------------------------------------------------------------------
      # 6) Record start time
      # -------------------------------------------------------------------
      - name: Record batch start time
        id: batch_start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"
          echo "CMS Batch 1 started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee "${{ env.REPORT_DIR }}/batch1-run.log"

      # -------------------------------------------------------------------
      # 7) Run 21 flows sequentially (1 worker, 5 min/flow cap)
      # -------------------------------------------------------------------
      - name: Run CMS Batch 1 — 21 create/setup flows (exact sequence via script)
        id: batch1_run
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Starting CMS Batch 1 via scripts/run-cms-batch1.sh…"
          echo "Sequence: create-a-new-stack-part-1 → add-an-environment → … → add-workflows-and-stages"
          bash scripts/run-cms-batch1.sh
          EXIT_CODE=$?
          echo "Batch 1 exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      # -------------------------------------------------------------------
      # 8) Compute total run time and generate reports (always)
      # -------------------------------------------------------------------
      - name: Compute run time and generate reports
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
          BATCH_START_ISO: ${{ steps.batch_start.outputs.start_iso }}
          BATCH1_OUTCOME: ${{ steps.batch1_run.outcome }}
        run: |
          set -eo pipefail
          END_EPOCH="$(date +%s)"
          ELAPSED_SECS=$(( END_EPOCH - BATCH_START_EPOCH ))
          ELAPSED_MIN=$(( ELAPSED_SECS / 60 ))
          ELAPSED_SEC=$(( ELAPSED_SECS % 60 ))

          echo "" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "CMS Batch 1 finished" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "  Started  : ${BATCH_START_ISO}" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "  Finished : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "  Duration : ${ELAPSED_MIN}m ${ELAPSED_SEC}s" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "  Outcome  : ${BATCH1_OUTCOME}" | tee -a "$REPORT_DIR/batch1-run.log"
          echo "=============================" | tee -a "$REPORT_DIR/batch1-run.log"

          # Write timing summary for Slack/email
          cat > "$REPORT_DIR/timing-summary.txt" <<EOF
          CMS Batch 1 — Duration: ${ELAPSED_MIN}m ${ELAPSED_SEC}s
          Started:  ${BATCH_START_ISO}
          Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Outcome:  ${BATCH1_OUTCOME}
          Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          # Generate HTML + Excel reports if flows-results.json exists
          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            npx ts-node scripts/generateCmsExcelReport.ts    --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateCmsDashboardHtml.ts  --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/generateUnifiedReport.ts     --reportDir "$REPORT_DIR" 2>&1 || true
            npx ts-node scripts/urlRunSummaryAndSlack.ts      --reportDir "$REPORT_DIR" 2>&1 || true
          else
            echo "::warning::flows-results.json not found — report generation skipped."
          fi

      # -------------------------------------------------------------------
      # 9) Upload artifacts — reports + screenshots of failures
      # -------------------------------------------------------------------
      - name: Upload CMS Batch 1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch1-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-batch1-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch1-playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-batch1-${{ github.run_id }}-${{ github.run_attempt }}/html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch1-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore

      # -------------------------------------------------------------------
      # 10) Report email (optional — configure REPORT_EMAIL_* secrets)
      # -------------------------------------------------------------------
      - name: Report email — gate on secrets
        id: email_gate
        if: always()
        env:
          TO: ${{ secrets.REPORT_EMAIL_TO }}
          HOST: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          USER: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          PASS: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          PORT_RAW: ${{ secrets.REPORT_EMAIL_SMTP_PORT }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_REPORT_EMAIL:-}" == "1" ]] || \
             [[ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_report_email == 'true' }}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PORT="${PORT_RAW:-587}"
          if [[ -z "${TO:-}" || -z "${HOST:-}" || -z "${USER:-}" || -z "${PASS:-}" || -z "${FROM:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped — REPORT_EMAIL_* secrets not fully configured."
            exit 0
          fi
          echo "enabled=true"  >> "$GITHUB_OUTPUT"
          echo "server_port=${PORT}" >> "$GITHUB_OUTPUT"
          [[ "${PORT}" == "465" ]] && echo "secure=true" >> "$GITHUB_OUTPUT" || echo "secure=false" >> "$GITHUB_OUTPUT"

      - name: Report email — write body
        id: email_body
        if: always() && steps.email_gate.outputs.enabled == 'true'
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          CMS_STEP_OUTCOME: ${{ steps.batch1_run.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx ts-node scripts/gha/writeCmsDailyReportEmailBody.ts "${{ github.workspace }}/cms-batch1-email-body.txt" || true

      - name: Report email — send
        if: always() && steps.email_gate.outputs.enabled == 'true' && steps.email_body.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          server_port: ${{ steps.email_gate.outputs.server_port }}
          username: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          secure: ${{ steps.email_gate.outputs.secure == 'true' }}
          subject: >-
            [CMS Batch 1] ${{ steps.batch1_run.outcome }} — ${{ github.repository }} (#${{ github.run_number }})
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          body: file://${{ github.workspace }}/cms-batch1-email-body.txt

      # -------------------------------------------------------------------
      # 11) Slack summary (always — success OR failure)
      # -------------------------------------------------------------------
      - name: Post Slack summary
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CMS_STEP_OUTCOME: ${{ steps.batch1_run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Override job-level SKIP_SLACK=1 — this step IS the Slack poster.
          SKIP_SLACK: "0"
        run: |
          set -eo pipefail
          if [[ -z "${SLACK_BOT_TOKEN:-}" || -z "${SLACK_CHANNEL_ID:-}" ]]; then
            echo "::warning::Slack skipped — SLACK_BOT_TOKEN and/or SLACK_CHANNEL_ID not configured."
            exit 0
          fi

          # Compute duration for Slack message
          START="${{ steps.batch_start.outputs.start_epoch }}"
          END="$(date +%s)"
          ELAPSED=$(( END - START ))
          ELAPSED_MIN=$(( ELAPSED / 60 ))
          ELAPSED_SEC=$(( ELAPSED % 60 ))
          DURATION="${ELAPSED_MIN}m ${ELAPSED_SEC}s"

          if [[ -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "Posting detailed Slack summary via urlRunSummaryAndSlack.ts…"
            BATCH1_DURATION_LABEL="CMS Batch 1 (${DURATION})" \
              npx ts-node scripts/urlRunSummaryAndSlack.ts 2>&1 || \
              echo "::warning::urlRunSummaryAndSlack.ts failed — posting minimal alert"
          else
            ICON=":white_check_mark:"
            [[ "${CMS_STEP_OUTCOME:-}" != "success" ]] && ICON=":x:"
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json" \
              --data "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${ICON} *CMS Batch 1 — ${CMS_STEP_OUTCOME:-unknown}* | Duration: ${DURATION} | 21 create/setup flows | 1 worker | 5 min cap. <${RUN_URL}|Open run>\"}" \
              | grep -q '"ok":true' && echo "Slack posted." || echo "::warning::Slack API call failed."
          fi

      - name: Publish report to dashboard (CMS Batch 1)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
          REPORT_DIR: ${{ env.REPORT_DIR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::Publish to dashboard skipped — DASHBOARD_DATA_TOKEN secret not configured."
            exit 0
          fi
          if [[ ! -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "::warning::Publish to dashboard skipped — flows-results.json not found."
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - BATCH_START_EPOCH ))
          DURATION_SECONDS="${ELAPSED}" npx ts-node scripts/publishToDashboard.ts \
            --reportDir "${REPORT_DIR}" \
            --suite cms-batch1 \
            --suiteLabel "CMS Batch 1" \
            --out /tmp/dashboard-cms-batch1.json \
            --reportsOutDir /tmp/reports-cms-batch1 \
            2>&1 || { echo "::warning::publishToDashboard.ts failed"; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git" /tmp/dashboard-data
          cd /tmp/dashboard-data
          if [ -d /tmp/reports-cms-batch1 ]; then
            node scripts/publish.js /tmp/dashboard-cms-batch1.json:/tmp/reports-cms-batch1
          else
            node scripts/publish.js /tmp/dashboard-cms-batch1.json
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish docs-contentstack-ai-automation/cms-batch1 report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
