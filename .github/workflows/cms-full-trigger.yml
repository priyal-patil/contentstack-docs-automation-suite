# =============================================================================
# CMS Full Run — 5:00 AM IST dispatcher (single cron for Batch 1 → 2 → 3)
#
# Fires repository_dispatch: cms-full-5am-ist so cms-full-scheduled.yml
# (Batch 1 → Batch 2 → Batch 3) is triggered reliably at 5:00 AM IST.
# 5:00 AM IST (UTC+5:30) = 23:30 UTC (previous day)
# =============================================================================

name: CMS Full Run — 3:00 AM IST dispatcher

on:
  schedule:
    # 21:30 UTC = 3:00 AM IST (Asia/Kolkata, UTC+5:30)
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Fire cms-full-5am-ist event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch cms-full-5am-ist to CMS Full Run workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TRIGGERED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Firing repository_dispatch: cms-full-5am-ist at ${TRIGGERED_AT}"
          printf '{"event_type":"cms-full-5am-ist","client_payload":{"source":"cms-full-trigger.yml","triggered_at":"%s"}}' \
            "${TRIGGERED_AT}" \
            | gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository }}/dispatches \
                --input -
          echo "Dispatch sent. CMS Full Run workflow (Batch 1 → 2 → 3) will start shortly."
