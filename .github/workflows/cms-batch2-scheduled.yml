# =============================================================================
# CMS Batch 2 — runs automatically after CMS Batch 1 completes
# =============================================================================
#
# Triggered by: workflow_run on "CMS Batch 1 — daily create flows (5 AM IST, 1 worker)"
#   → fires whenever Batch 1 finishes (success OR failure — Batch 2 still runs so
#     edit/update flows can be tested even if some creates partially failed).
#
# Modules (7 workers, one per module, all start simultaneously):
#   environment, language, branches, stack, content-models, global-field, assets, entries
#
# CRUD order within each module:
#   create/add (if not in Batch 1) → edit/update → move/import/export → misc
#   Delete flows are ALWAYS skipped.
#
# Skipped flows:
#   All 21 Batch 1 bootstrap flows (via CMS_SKIP_FLOW_IDS).
#
# Timeouts:
#   • Element/action: 3 min (PW_ACTION_TIMEOUT_MINUTES=3) — if stuck on any
#     element for more than 3 minutes, the step fails immediately.
#   • Per-module test: 60 min (PW_FLOW_MAX_MINUTES=60) — generous for
#     content-models which has 30+ flows.
#   • Job hard cap: 180 min (same as Batch 1).
#
# Stack: uses stack created by Batch 1; falls back to DEFAULT_STACK secret /
#        PriyalDocsStack (via core/navigation.ts selectStack()).
#
# Infrastructure: same Docker image as Batch 1 — Chromium pre-installed,
#   zero CDN download (~25s pull vs 30+ min).
# =============================================================================

name: CMS Batch 2 — edit/update flows (after Batch 1, 7 workers)

on:
  # Primary trigger: fires automatically when Batch 1 workflow completes.
  workflow_run:
    workflows:
      - "CMS Batch 1 — daily create flows (5 AM IST, 1 worker)"
    types:
      - completed

  # Manual trigger (re-run Batch 2 on demand from Actions tab).
  workflow_dispatch:
    inputs:
      skip_slack:
        description: "Skip Slack notification"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_report_email:
        description: "Skip report email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: write

jobs:
  cms-batch2:
    name: CMS Batch 2 — 7 modules (7 workers, CRUD, 60 min/module, 3 min element)
    runs-on: ubuntu-latest
    # Same Docker image as Batch 1: Chromium pre-installed, zero CDN download.
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-jammy
      options: --user root
    # 6 hours: content-models alone has 59 flows × 5 min/flow = up to 295 min sequential.
    # With 7 parallel subprocesses (one per module) wall time ≈ slowest module.
    # 360 min gives a comfortable buffer even if content-models is fully sequential.
    timeout-minutes: 360
    env:
      CI: "true"
      PLAYWRIGHT_HEADLESS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OPEN_FLOW_REPORT: "false"
      OPEN_CMS_DASHBOARD: "0"
      SKIP_OPEN_DASHBOARD: "1"
      PW_SLOWMO: "0"
      # 14 shared workers across all 106 flows from 8 modules.
      # When any module finishes its worker immediately picks up the next
      # queued flow from any other module — zero idle time.
      # Safe on GHA 2-core / 7 GB: 14 × 250 MB headless Chromium = 3.5 GB.
      # Raise to PW_WORKERS=20 for max speed (5 GB, still within 7 GB limit).
      PW_WORKERS: "14"
      # Per-FLOW timeout: 5 min per individual flow.
      # CMS_SEQUENTIAL_MODULE_ORDER=0 means each flow is its own test so
      # this actually applies (no 4-hour CMS_MODULE_BATCH_TIMEOUT_MS override).
      PW_FLOW_MAX_MINUTES: "5"
      # Element/action timeout: if stuck on any element for >3 min, fail the step.
      PW_ACTION_TIMEOUT_MINUTES: "3"
      # Deterministic report path.
      REPORT_DIR: ${{ github.workspace }}/reports/cms-batch2-${{ github.run_id }}-${{ github.run_attempt }}
      # Suppress Slack inside bash — GHA step handles Slack so it fires even on crash.
      SKIP_SLACK: "1"

    steps:
      # -------------------------------------------------------------------
      # 1) Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2) npm cache + install (Node.js already in Docker image)
      # -------------------------------------------------------------------
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Browsers pre-installed in Docker image.
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 prevents npm install from downloading anything.

      # -------------------------------------------------------------------
      # 3) Credentials from secrets
      # -------------------------------------------------------------------
      - name: Write .env for automation
        env:
          CS_APP_ORIGIN: ${{ secrets.CS_APP_ORIGIN }}
          CS_EMAIL: ${{ secrets.CS_EMAIL }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          DEFAULT_STACK: ${{ secrets.DEFAULT_STACK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          : "${CS_EMAIL:?secret CS_EMAIL is required}"
          : "${CS_PASSWORD:?secret CS_PASSWORD is required}"
          : "${DEFAULT_STACK:?secret DEFAULT_STACK is required}"
          {
            echo "CS_APP_ORIGIN=${CS_APP_ORIGIN:-https://app.contentstack.com}"
            echo "CS_EMAIL=${CS_EMAIL}"
            echo "CS_PASSWORD=${CS_PASSWORD}"
            echo "DEFAULT_STACK=${DEFAULT_STACK}"
            if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then echo "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}"; fi
            if [[ -n "${SLACK_CHANNEL_ID:-}" ]]; then echo "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"; fi
          } > .env
          chmod 600 .env
          echo "✓ .env written (DEFAULT_STACK will be used as Batch 2 target stack)"

      # -------------------------------------------------------------------
      # 4) Record start time
      # -------------------------------------------------------------------
      - name: Record batch start time
        id: batch_start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "start_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          mkdir -p "${{ env.REPORT_DIR }}"
          echo "CMS Batch 2 started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee "${{ env.REPORT_DIR }}/batch2-run.log"

      # -------------------------------------------------------------------
      # 5) Run Batch 2 — 7 modules in parallel (CRUD order, skip Batch 1 + deletes)
      # -------------------------------------------------------------------
      - name: Run CMS Batch 2 — 7 modules (environment, language, branches, stack, content-models, global-field, assets, entries)
        id: batch2_run
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -uo pipefail
          echo "Starting CMS Batch 2 via scripts/run-cms-batch2.sh…"
          echo "Architecture: 7 parallel subprocesses (one per module)"
          echo "              CMS_SEQUENTIAL_MODULE_ORDER=0, PW_WORKERS=1/module"
          echo "              5 min/flow | 3 min element timeout"
          echo "              ~93 flows total across all 7 modules"
          bash scripts/run-cms-batch2.sh
          EXIT_CODE=$?
          echo "Batch 2 exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}

      # -------------------------------------------------------------------
      # 6) Compute total run time and generate reports (always)
      # -------------------------------------------------------------------
      - name: Collect partial results and generate reports (always — runs even on cancellation)
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          BATCH_START_EPOCH: ${{ steps.batch_start.outputs.start_epoch }}
          BATCH_START_ISO: ${{ steps.batch_start.outputs.start_iso }}
          BATCH2_OUTCOME: ${{ steps.batch2_run.outcome }}
        run: |
          set -eo pipefail
          END_EPOCH="$(date +%s)"
          ELAPSED_SECS=$(( END_EPOCH - BATCH_START_EPOCH ))
          ELAPSED_MIN=$(( ELAPSED_SECS / 60 ))
          ELAPSED_SEC=$(( ELAPSED_SECS % 60 ))

          LOG="$REPORT_DIR/batch2-run.log"
          echo "" | tee -a "$LOG"
          echo "=============================" | tee -a "$LOG"
          echo "CMS Batch 2 — ${BATCH2_OUTCOME}" | tee -a "$LOG"
          echo "  Started  : ${BATCH_START_ISO}" | tee -a "$LOG"
          echo "  Finished : $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$LOG"
          echo "  Duration : ${ELAPSED_MIN}m ${ELAPSED_SEC}s" | tee -a "$LOG"
          echo "  Modules  : environment, language, branches, stack, content-models, global-field, assets, entries" | tee -a "$LOG"
          echo "=============================" | tee -a "$LOG"

          cat > "$REPORT_DIR/timing-summary.txt" <<EOF
          CMS Batch 2 — Duration: ${ELAPSED_MIN}m ${ELAPSED_SEC}s
          Started:  ${BATCH_START_ISO}
          Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Outcome:  ${BATCH2_OUTCOME}
          Modules:  environment, language, branches, stack, content-models, global-field, assets, entries
          Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          # Merge whatever module part files exist (handles partial/cancelled runs).
          # Each module subprocess writes its results to playwright-parts/module-<name>.json
          # as soon as IT finishes — so completed modules are always captured.
          PARTS_DIR="$REPORT_DIR/playwright-parts"
          shopt -s nullglob
          PART_FILES=("$PARTS_DIR"/module-*.json)
          shopt -u nullglob

          TOTAL_MODULES=7
          PARTS_COUNT=${#PART_FILES[@]}
          echo "Module results found: ${PARTS_COUNT}/${TOTAL_MODULES}" | tee -a "$LOG"

          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            echo "flows-results.json already present (normal completion)." | tee -a "$LOG"
          elif [[ "${PARTS_COUNT}" -gt 0 ]]; then
            echo "Merging ${PARTS_COUNT} partial module result(s) — job was cancelled/timed-out." | tee -a "$LOG"
            npx ts-node scripts/mergePlaywrightFlowJsonReports.ts \
              --out "$REPORT_DIR/flows-results.json" "${PART_FILES[@]}" 2>&1 | tee -a "$LOG" || true
          else
            echo "::warning::No module results found — all subprocesses were killed before finishing."
          fi

          if [[ -f "$REPORT_DIR/flows-results.json" ]]; then
            npx ts-node scripts/generateCmsExcelReport.ts   --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/generateCmsDashboardHtml.ts --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
            npx ts-node scripts/generateUnifiedReport.ts    --reportDir "$REPORT_DIR" 2>&1 | tee -a "$LOG" || true
          else
            echo "::warning::flows-results.json not found — report generation skipped."
          fi

      # -------------------------------------------------------------------
      # 7) Upload artifacts — reports + screenshots of failures
      # -------------------------------------------------------------------
      - name: Upload CMS Batch 2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch2-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-batch2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch2-playwright-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cms-batch2-${{ github.run_id }}-${{ github.run_attempt }}/html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-batch2-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore

      # -------------------------------------------------------------------
      # 8) Report email (optional — same secrets as Batch 1)
      # -------------------------------------------------------------------
      - name: Report email — gate on secrets
        id: email_gate
        if: always()
        env:
          TO: ${{ secrets.REPORT_EMAIL_TO }}
          HOST: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          USER: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          PASS: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          PORT_RAW: ${{ secrets.REPORT_EMAIL_SMTP_PORT }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_REPORT_EMAIL:-}" == "1" ]] || \
             [[ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_report_email == 'true' }}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PORT="${PORT_RAW:-587}"
          if [[ -z "${TO:-}" || -z "${HOST:-}" || -z "${USER:-}" || -z "${PASS:-}" || -z "${FROM:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Report email skipped — REPORT_EMAIL_* secrets not fully configured."
            exit 0
          fi
          echo "enabled=true"  >> "$GITHUB_OUTPUT"
          echo "server_port=${PORT}" >> "$GITHUB_OUTPUT"
          [[ "${PORT}" == "465" ]] && echo "secure=true" >> "$GITHUB_OUTPUT" || echo "secure=false" >> "$GITHUB_OUTPUT"

      - name: Report email — write body
        id: email_body
        if: always() && steps.email_gate.outputs.enabled == 'true'
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          CMS_STEP_OUTCOME: ${{ steps.batch2_run.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx ts-node scripts/gha/writeCmsDailyReportEmailBody.ts "${{ github.workspace }}/cms-batch2-email-body.txt" || true

      - name: Report email — send
        if: always() && steps.email_gate.outputs.enabled == 'true' && steps.email_body.outcome == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.REPORT_EMAIL_SMTP_HOST }}
          server_port: ${{ steps.email_gate.outputs.server_port }}
          username: ${{ secrets.REPORT_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.REPORT_EMAIL_SMTP_PASSWORD }}
          secure: ${{ steps.email_gate.outputs.secure == 'true' }}
          subject: >-
            [CMS Batch 2] ${{ steps.batch2_run.outcome }} — environment, language, branches, stack, content-models, global-field, assets, entries — ${{ github.repository }} (#${{ github.run_number }})
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          body: file://${{ github.workspace }}/cms-batch2-email-body.txt

      # -------------------------------------------------------------------
      # 9) Slack summary (always — success OR failure)
      # -------------------------------------------------------------------
      - name: Post Slack summary
        if: always()
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CMS_STEP_OUTCOME: ${{ steps.batch2_run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Override job-level SKIP_SLACK=1 — this step IS the Slack poster.
          SKIP_SLACK: "0"
        run: |
          set -eo pipefail
          if [[ -z "${SLACK_BOT_TOKEN:-}" || -z "${SLACK_CHANNEL_ID:-}" ]]; then
            echo "::warning::Slack skipped — SLACK_BOT_TOKEN and/or SLACK_CHANNEL_ID not configured."
            exit 0
          fi

          START="${{ steps.batch_start.outputs.start_epoch }}"
          END="$(date +%s)"
          ELAPSED=$(( END - START ))
          ELAPSED_MIN=$(( ELAPSED / 60 ))
          ELAPSED_SEC=$(( ELAPSED % 60 ))
          DURATION="${ELAPSED_MIN}m ${ELAPSED_SEC}s"

          if [[ -f "${REPORT_DIR}/flows-results.json" ]]; then
            echo "Posting detailed Slack summary via urlRunSummaryAndSlack.ts…"
            CMS_BATCH_DURATION_LABEL="CMS Batch 2: environment, language, branches, stack, content-models, global-field, assets, entries (${DURATION})" \
              npx ts-node scripts/urlRunSummaryAndSlack.ts --reportDir "${REPORT_DIR}" 2>&1 || \
              echo "::warning::urlRunSummaryAndSlack.ts failed — posting minimal alert"
          else
            ICON=":white_check_mark:"
            [[ "${CMS_STEP_OUTCOME:-}" != "success" ]] && ICON=":x:"
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json" \
              --data "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${ICON} *CMS Batch 2 — ${CMS_STEP_OUTCOME:-unknown}* | Duration: ${DURATION} | Modules: environment, language, branches, stack, content-models, global-field, assets, entries | 7 workers | CRUD order | 3 min element timeout. <${RUN_URL}|Open run>\"}" \
              | grep -q '"ok":true' && echo "Slack posted." || echo "::warning::Slack API call failed."
          fi
