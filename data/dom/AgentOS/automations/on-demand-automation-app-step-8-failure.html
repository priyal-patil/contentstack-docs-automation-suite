    position: absolute;

    display: block;

    width: 20px;
    height: 20px;
    padding: 0;
    transform: translate(0, -50%);

    cursor: pointer;

    color: transparent;
    border: none;
    outline: none;
    background: transparent;
}

.slick-next:focus:before

    opacity: 1;

    opacity: .25;

{
    content: '←';

{
    content: '→';
}

.slick-next

    right: auto;
